
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kasparro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      COINPAPRIKA_API_KEY: ${COINPAPRIKA_API_KEY}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  etl:
    build: .
    command: python -m app.etl.run_all
    environment:
      DATABASE_URL: ${DATABASE_URL}
      COINPAPRIKA_API_KEY: ${COINPAPRIKA_API_KEY}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:
